<html> 
<head>
  <title>My First Calculator</title>
 </head>
 <body>

<input type="text" id="display" readonly>
<div>
  <button onclick="addNumber('1')">1</button>
  <button onclick="addNumber('2')">2</button>
  <button onclick="addNumber('3')">3</button>
  <button onclick="clearScreen()">C</button>
  <button onclick="deleteLast()">⌫</button>
</div>   

  <div>
    <button onclick="addNumber('4')">4</button>
    <button onclick="addNumber('5')">5</button>
    <button onclick="addNumber('6')">6</button>
    <button onclick="addNumber('+')">+</button>
  </div>

  <div>
     <button onclick="addNumber('7')">7</button>
     <button onclick="addNumber('8')">8</button>
     <button onclick="addNumber('9')">9</button>
     <button onclick="addNumber('-')">-</button>
   </div>

   <div>
      <button onclick="addNumber('00')">00</button>
      <button onclick="addNumber('0')">0</button>
      <button onclick="calculate()">=</button>
   </div>


<script>
  function addNumber(character) {
  	let currentScreen = document.getElementById('display');
  	currentScreen.value = currentScreen.value + character;
  }
  function clearScreen() {
  	document.getElementById('display').value = "";
  }
  function calculate() {
  	let currentScreen = document.getElementById('display');
  	try {
  		currentScreen.value = eval(currentScreen.value);
  	} catch (error) {
  		currentScreen.value = "Error";
  	}
  }
  function deleteLast() {
  	let currentScreen = document.getElementById('display');
  	currentScreen.value = currentScreen.value.slice(0, -1);
  }
  	
  
</script>

 </body>
 </html>
